<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>事務センター</title></head><body style="font-family:sans-serif;padding:24px"><p id="m">事務センターへ移動しています…</p><p><a id="a" href="#">開かないときはここを押してください</a></p>
<script>
// 住所は u.txt から毎回読み直す（ページが古く残っても最新の住所に飛ぶ）
fetch('u.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(u=>{u=u.trim();document.getElementById('a').href=u+'/';location.replace(u+'/'+location.search)}).catch(()=>{document.getElementById('m').textContent='読み込みに失敗しました。もう一度開いてください。'});
</script></body></html>
